# BeerPOS Blueprint for Render.
# Deploy: push this repo to GitHub/GitLab, then in Render: New -> Blueprint -> select the repo.
# Render reads this file and provisions the web service + managed Postgres.
#
# Prerequisites (set in the Render dashboard after the first deploy):
#   - CORS_ORIGIN (e.g. https://beerpos.onrender.com)
#   - REDIS_URL (recommended, e.g. a Render Key Value / Redis instance) to persist sessions
#   - S3_BACKUP_* (optional) for offsite backups
# FINGERPRINT_ENCRYPTION_KEY is generated by Render automatically.
#
# SECURITY: this schema intentionally ships NO demo data or default credentials.
# After the first successful deploy, run once (Render Shell or local against the prod DB):
#   1) npm run db:init                 # apply schema/indexes
#   2) node backend/scripts/seedPlatformAdmin.js <name> <strong-pin>   # creates the super-admin
# Then log in at /admin.html with those credentials and onboard the first business.
#
# NOTE (MVP tradeoffs):
#  - Sessions are file-backed (/app/data) on ephemeral storage by default: they are lost on
#    redeploy/restart (staff simply log in again). Set REDIS_URL to persist sessions.
#  - Uploaded logos persist on the attached disk (/app/backend/uploads).
#  - Daily DB backups are written to local disk AND, when S3_BACKUP_BUCKET is set, copied
#    offsite to S3-compatible storage.

services:
  - type: web
    name: beerpos
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter           # paid, no spin-down (required for Socket.io/SSE always-on)
    region: oregon
    healthCheckPath: /api/health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: SESSION_TTL_MS
        value: "28800000"
      - key: CORS_ORIGIN
        sync: false        # set in dashboard, e.g. https://beerpos.onrender.com
      - key: FINGERPRINT_ENCRYPTION_KEY
        generateValue: true # Render generates a strong random secret (hashed to 32 bytes)
      - key: JWT_SECRET
        sync: false
      # Persist sessions across restarts (Redis / Render Key Value). Leave unset for file store.
      - key: REDIS_URL
        sync: false
      # Offsite backups (AWS S3, Cloudflare R2, Backblaze B2, Spaces, MinIO).
      - key: S3_BACKUP_BUCKET
        sync: false
      - key: S3_BACKUP_ENDPOINT
        sync: false
      - key: S3_BACKUP_REGION
        sync: false
      - key: S3_BACKUP_PREFIX
        value: backups
      - key: S3_BACKUP_ACCESS_KEY_ID
        sync: false
      - key: S3_BACKUP_SECRET_ACCESS_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: beerpos-db
          property: connectionString
    disk:
      name: beerpos-uploads
      mountPath: /app/backend/uploads
      sizeGB: 1

databases:
  - name: beerpos-db
    plan: starter
    region: oregon
    databaseName: beerpos
    user: beerpos