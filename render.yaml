# BeerPOS Blueprint for Render — FREE tier (no credit card required).
#
# Deploy: push this repo to GitHub, then in Render: New -> Blueprint -> select the repo.
# Render reads this file and provisions a FREE Docker web service + FREE Postgres.
#
# IMPORTANT — what the free tier means (and why this file is shaped this way):
#   - Free web services have NO shell and NO pre-deploy command, so the schema and the
#     platform admin are created automatically on boot via DB_AUTOINIT / BOOTSTRAP_ADMIN_*.
#   - Free web services spin down after 15 min idle and wake in ~1 min. WebSocket messages
#     count as activity, so Socket.io/SSE stay alive while the service is awake.
#   - Free Postgres EXPIRES 30 days after creation (data is deleted). Fine for testing,
#     NOT for a real pilot. Upgrade the DB to a paid plan when you go live.
#   - The filesystem is ephemeral: uploaded logos are lost on spin-down/redeploy.
#
# Required env vars (set in the Render dashboard → Environment):
#   - BOOTSTRAP_ADMIN_NAME super-admin username
#   - BOOTSTRAP_ADMIN_PIN  super-admin PIN (6-12 digits)
# Optional:
#   - CORS_ORIGIN   defaults to Render's public URL (RENDER_EXTERNAL_URL) if unset
#   - JWT_SECRET    long random string (reserved for future use)
# FINGERPRINT_ENCRYPTION_KEY is generated by Render automatically.
#
# First login: open /admin.html with BOOTSTRAP_ADMIN_NAME / BOOTSTRAP_ADMIN_PIN.
# Onboard the first business from there.

services:
  - type: web
    name: beerpos
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /api/health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: SESSION_TTL_MS
        value: "28800000"
      # Apply db/schema.sql on boot (idempotent). Required because free services have no shell.
      - key: DB_AUTOINIT
        value: "1"
      # Platform admin bootstrapped on first boot (created once; PIN not rotated on restart).
      - key: BOOTSTRAP_ADMIN_NAME
        sync: false
      - key: BOOTSTRAP_ADMIN_PIN
        sync: false
      # Rotate the bootstrapped admin's PIN on next boot (set to "1", redeploy, then unset).
      - key: BOOTSTRAP_ADMIN_ROTATE
        value: "0"
      # CORS: optional. If unset, the app uses Render's public URL (RENDER_EXTERNAL_URL)
      # automatically. Set it only to override (e.g. custom domain):
      # - key: CORS_ORIGIN
      #   sync: false      # e.g. https://beerpos.onrender.com
      - key: FINGERPRINT_ENCRYPTION_KEY
        generateValue: true # Render generates a strong random secret (hashed to 32 bytes)
      - key: JWT_SECRET
        sync: false
      # Persist sessions across restarts (Render Key Value / Redis). Optional; file store otherwise.
      - key: REDIS_URL
        sync: false
      # Offsite backups (AWS S3, Cloudflare R2, Backblaze B2, Spaces, MinIO). Optional.
      - key: S3_BACKUP_BUCKET
        sync: false
      - key: S3_BACKUP_ENDPOINT
        sync: false
      - key: S3_BACKUP_REGION
        sync: false
      - key: S3_BACKUP_PREFIX
        value: backups
      - key: S3_BACKUP_ACCESS_KEY_ID
        sync: false
      - key: S3_BACKUP_SECRET_ACCESS_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: beerpos-db
          property: connectionString

databases:
  - name: beerpos-db
    plan: free
    region: oregon
    databaseName: beerpos
    user: beerpos