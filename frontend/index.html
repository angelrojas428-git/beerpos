            </div>
            <div class="bg-slate-800 rounded-xl p-3 text-center">

        <button @click="backspaceNumeric()" class="bg-rose-900/50 hover:bg-rose-900 rounded-xl py-4 text-2xl font-bold text-rose-300 active:scale-95 transition-transform">âŒ«</button>
      </div>
      <div class="mt-4 flex justify-end">
        <button @click="applyNumericKeypad()" class="px-6 py-2 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold">Aceptar</button>
      </div>
    </div>
  </div>

  <!-- Credit statement modal -->
  <div x-show="creditStatement" x-transition class="fixed inset-0 z-60 flex items-center justify-center p-2 md:p-4 bg-black/70" @click.self="creditStatement=null">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl p-4 md:p-6 w-full max-w-2xl max-h-[92vh] flex flex-col shadow-2xl min-w-0">

        <h2 class="text-lg font-bold text-slate-100 truncate">Estado de cuenta</h2>
        <button @click="creditStatement=null" class="text-slate-400 hover:text-white text-2xl p-1 shrink-0">âœ•</button>
      </div>
      <template x-if="creditStatement">
        <div class="min-h-0 overflow-y-auto">
          <div class="bg-slate-800 rounded-xl p-3 mb-3 text-sm">
            <div class="font-semibold text-slate-100" x-text="creditStatement.client?.full_name"></div>
            <div class="text-slate-400">Debe: $<span x-text="Number(creditStatement.client?.credit_balance_usd||0).toFixed(2)"></span> Â· LÃ­mite: $<span x-text="Number(creditStatement.client?.credit_limit_usd||0).toFixed(2)"></span></div>
          </div>
          <table class="w-full text-sm">
            <thead class="text-slate-400 text-left">
              <tr class="border-b border-slate-700">
                <th class="py-1 pr-2">Fecha</th>
                <th class="py-1 pr-2">Tipo</th>
                <th class="py-1 pr-2 text-right">Monto</th>
                <th class="py-1 pr-2 text-right">Saldo</th>

            </thead>
            <tbody>
              <template x-for="e in creditStatement.entries" :key="e.id">
                <tr class="border-b border-slate-800/60">
                  <td class="py-1 pr-2 text-slate-400 whitespace-nowrap" x-text="new Date(e.created_at).toLocaleDateString('es-VE')"></td>
                  <td class="py-1 pr-2 text-slate-300" x-text="e.entry_type"></td>
                  <td class="py-1 pr-2 text-right font-mono" :class="Number(e.amount_usd) < 0 ? 'text-emerald-400' : 'text-rose-400'" x-text="'$'+Number(e.amount_usd).toFixed(2)"></td>
                  <td class="py-1 pr-2 text-right font-mono text-slate-200" x-text="'$'+Number(e.balance_after_usd).toFixed(2)"></td>
                  <td class="py-1 text-slate-400 truncate max-w-[10rem]" x-text="e.note || ''"></td>
                </tr>
              </template>
              <template x-if="creditStatement.entries.length === 0">
                <tr><td colspan="5" class="py-4 text-center text-slate-500">Sin movimientos.</td></tr>
              </template>
            </tbody>
          </table>
        </div>
      </template>
      <div class="mt-4 flex justify-between gap-2 shrink-0">
        <button @click="downloadStatementPdf()" class="px-4 py-2 rounded-lg bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold">Descargar PDF</button>
        <button @click="creditStatement=null" class="px-4 py-2 rounded-lg bg-slate-800 text-slate-300 font-medium">Cerrar</button>
      </div>
    </div>
  </div>

  <!-- QR modal -->
  <div x-show="qrModal" x-transition class="fixed inset-0 z-60 flex items-center justify-center p-2 md:p-4 bg-black/70" style="display:none" @click.self="qrModal=null">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl p-4 md:p-6 w-full max-w-md max-h-[95vh] overflow-y-auto shadow-2xl text-center min-w-0">
      <div class="text-lg font-bold mb-2 truncate" x-text="qrModal?.full_name"></div>
      <div class="text-sm text-slate-300 mb-2 truncate">Apunta la cÃ¡mara del celular al cÃ³digo QR</div>

        <div class="qr-canvas-wrap bg-white p-3 rounded-xl inline-block shadow-lg border-4" :style="{ borderColor: est?.secondary_color || '#f59e0b' }" id="qr-modal-canvas"></div>
      </div>
      <div class="flex justify-center mb-2 shrink-0">
        <img x-show="est?.logo_url" :src="est?.logo_url" :alt="est?.name" class="h-8 w-8 rounded-lg object-cover mb-1" />

      <div class="text-xs text-slate-400 break-all mb-4 line-clamp-2" x-text="qrModal ? clientLink(qrModal.access_token) : ''"></div>
      <div class="grid grid-cols-2 gap-2 mb-3">
        <button @click="copyLink(qrModal.access_token)" class="py-2 rounded-lg bg-slate-700 font-semibold text-xs truncate">Copiar enlace</button>

      </div>
      <div class="mt-2 p-2 bg-slate-800 rounded-lg text-[10px] text-slate-400 text-left border border-slate-700/30 break-words">
        <b class="text-slate-300">Si no abre:</b> activa â€œEscanear QRâ€ en la cÃ¡mara o copia el enlace por WhatsApp y Ã¡brelo desde el telÃ©fono.
      </div>
      <button @click="qrModal=null" class="mt-3 w-full py-2.5 rounded-lg bg-slate-800 text-slate-300 font-medium">Cerrar</button>
    </div>
  </div>

  <!-- Elegant toast notification -->
  <div x-show="toast.show" x-transition:enter="transition-opacity duration-300" x-transition:enter-start="opacity-0 -translate-y-full" x-transition:enter-end="opacity-100 translate-y-0" x-transition:leave="transition-opacity duration-300" x-transition:leave-start="opacity-100 translate-y-0" x-transition:leave-end="opacity-0 -translate-y-full"
       class="fixed top-4 left-1/2 -translate-x-1/2 z-50 flex items-center gap-2 toast-container">
    <div :class="`rounded-2xl px-8 py-4 shadow-2xl border border-white/10 flex items-center gap-4 min-w-[320px] ${toast.type === 'error' ? 'bg-rose-900/95 border-rose-500/50 text-rose-100' : 'bg-emerald-900/95 border-emerald-500/50 text-emerald-100'}`">
      <span class="text-2xl" x-text="toast.type === 'error' ? 'âš ï¸' : 'âœ…'"></span>
      <div class="text-left min-w-0">
        <div class="font-semibold text-base break-all leading-tight" x-text="toast.title"></div>
        <div class="text-sm opacity-95 break-all leading-relaxed mt-1" x-text="toast.message"></div>
        <div x-show="toast.showBalance" class="text-xs text-opacity-80 mt-1.5 font-mono" x-text="`Saldo disponible: ${toast.balance} cerveza(s)`"></div>
      </div>
    </div>
  </div>

  <!-- Clients modal: Cargar combo / saldo -->
  <div x-show="clientsModalOpen" x-transition class="fixed inset-0 z-50 flex items-center justify-center p-3 md:p-6 bg-black/60" @click.self="clientsModalOpen=false">

      <div class="flex justify-between items-center mb-6 shrink-0">
        <h2 class="text-xl font-bold text-slate-100 truncate">Cargar combo / saldo</h2>
        <button @click="clientsModalOpen=false" class="text-slate-400 hover:text-white text-2xl p-1 shrink-0">âœ•</button>
      </div>
      <div class="flex flex-col sm:flex-row gap-3 mb-6 shrink-0">
        <div class="flex-1 min-w-0">

          <input x-model="clientSearch" @input.debounce.400ms="loadClients()" placeholder="Nombre, cÃ©dula o telÃ©fono..." class="w-full bg-slate-800 rounded-xl px-4 py-3 text-base focus:outline-none focus:ring-2 focus:ring-emerald-500" />
        </div>
        <button @click="loadClients()" class="px-6 py-3 rounded-xl bg-slate-700 hover:bg-slate-600 text-slate-300 font-semibold shrink-0 self-end sm:self-auto sm:mb-0">Actualizar</button>
      </div>
      <div class="flex-1 overflow-y-auto pr-1 space-y-4 min-h-0">
        <template x-if="clientsPaginated.length === 0">
          <div class="flex flex-col items-center justify-center py-20 text-center">
            <div class="text-2xl mb-3">ðŸ“­</div>
            <div class="text-slate-500 text-sm">Sin clientes registrados.</div>
          </div>
        </template>
        <template x-for="c in clientsPaginated" :key="c.id">
          <div class="client-row bg-slate-800/60 border border-slate-700/50 rounded-2xl p-4">
            <!-- Cliente info -->
            <div class="client-row-info">
<div class="flex items-center gap-2 flex-wrap min-w-0">
                  <div class="client-name font-semibold text-base text-slate-100" x-text="c.full_name"></div>
                  <span class="text-xs font-bold px-2 py-0.5 rounded bg-slate-700 text-slate-300 shrink-0" x-text="c.current_balance + ' cervezas'"></span>
                  <template x-if="Number(c.credit_limit_usd || 0) > 0">
                    <span class="text-xs font-bold px-2 py-0.5 rounded shrink-0" :class="creditBadgeClass(c)" x-text="'Fiado $' + Number(c.credit_balance_usd || 0).toFixed(2) + ' / $' + Number(c.credit_limit_usd || 0).toFixed(2)"></span>
                  </template>
                </div>
              <div class="text-xs text-slate-400 mt-1 truncate"><span x-text="formatDocumentId(c.document_id)"></span> Â· <span x-text="c.phone"></span></div>
              <div class="flex gap-2 mt-3 flex-wrap">
                <button @click="showQr(c)" class="btn-icon px-3 py-2 rounded-xl bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold text-sm" title="Ver QR">ðŸ“± QR</button>
                <button @click="rotateClientToken(c)" class="btn-icon px-3 py-2 rounded-xl bg-rose-600 hover:bg-rose-500 text-xs font-bold" title="Renovar QR">ðŸ”„</button>
                <button @click="copyClientLink(c)" class="btn-icon px-3 py-2 rounded-xl bg-slate-700 hover:bg-slate-600 text-xs font-bold" title="Copiar enlace">Copiar</button>
              </div>
            </div>
            <!-- Balance y acciones -->
            <div class="client-row-actions">
              <div class="client-row-balance">
                <div class="text-right">
                  <div class="text-xs text-slate-500 uppercase tracking-wider">Saldo</div>
                  <div class="text-3xl font-black text-slate-100 leading-none" x-text="c.current_balance"></div>
                  <div class="text-xs text-slate-400 mt-0.5">cerveza(s)</div>
                </div>
              </div>
              <div class="client-row-buttons">
                <input type="number" min="1" x-model.number="c._qty" placeholder="Cant." class="btn-grow bg-slate-700 rounded-xl px-3 py-3 text-base focus:outline-none focus:ring-2 focus:ring-emerald-500 text-center max-w-[6rem]" />
                <button @click="chargeCombo(c)" class="btn-grow py-3 px-4 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-bold text-base shadow-lg shadow-emerald-900/20 transition-all active:scale-95 whitespace-nowrap">+ Cargar</button>
                <button @click="fiadoSale(c)" :disabled="Number(c.credit_limit_usd || 0) <= 0" class="btn-grow py-3 px-4 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-base shadow-lg transition-all active:scale-95 whitespace-nowrap disabled:opacity-40 disabled:cursor-not-allowed">Fiado</button>
                <button @click="undoCharge(c)" :disabled="c.current_balance < 1" class="btn-icon w-12 h-12 rounded-xl bg-rose-600 hover:bg-rose-500 text-slate-950 font-bold text-lg disabled:opacity-40 disabled:cursor-not-allowed shadow-lg active:scale-95 shrink-0" title="Deshacer / restar carga">â†©</button>
                <template x-if="isOwner()">
                  <button @click="setCreditLimit(c)" class="btn-icon w-12 h-12 rounded-xl bg-sky-600 hover:bg-sky-500 text-white font-bold text-lg shadow-lg active:scale-95 shrink-0" title="Asignar lÃ­mite de crÃ©dito">ðŸ’³</button>
                </template>
              </div>
            </div>
          </div>
        </template>
      </div>
      <!-- Pagination -->
      <div x-show="clientsPages > 1" class="mt-8 flex items-center justify-center gap-4 border-t border-slate-700 pt-6">
        <button @click="prevClientPage()" :disabled="clientsPage === 1" class="px-5 py-2.5 rounded-xl bg-slate-700 hover:bg-slate-600 text-sm text-slate-300 font-medium disabled:opacity-40 disabled:cursor-not-allowed transition-colors">â† Anterior</button>
        <span class="text-xs text-slate-400 font-mono" x-text="`PÃ¡gina ${clientsPage} / ${clientsPages}`"></span>
        <button @click="nextClientPage()" :disabled="clientsPage >= clientsPages" class="px-5 py-2.5 rounded-xl bg-slate-700 hover:bg-slate-600 text-sm text-slate-300 font-medium disabled:opacity-40 disabled:cursor-not-allowed transition-colors">Siguiente â†’</button>
      </div>
    </div>
  </div>

  <script src="/dist/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
    }
  </script>
<div x-data="{open:false,text:'',loading:false}" class="fixed bottom-4 right-4 z-50"><button @click="open=true; if(!text){loading=true; fetch('/api/help/manual').then(r=>r.text()).then(t=>{text=t;loading=false;})}" class="bg-slate-800 text-white px-4 py-2 rounded-full shadow-lg text-sm">Ayuda</button><div x-show="open" class="fixed inset-0 bg-black/60 flex items-center justify-center p-4" @click.self="open=false"><div class="bg-slate-900 text-slate-100 rounded-xl max-w-3xl w-full max-h-[80vh] overflow-auto p-6"><div class="flex justify-between items-center mb-4"><h2 class="font-bold text-lg">Manual del sistema</h2><button @click="open=false" class="text-slate-400">X</button></div><pre x-show="loading" class="text-sm">Cargando...</pre><pre x-show="!loading" class="text-xs whitespace-pre-wrap" x-text="text"></pre></div></div></div>
</body>
</html>
